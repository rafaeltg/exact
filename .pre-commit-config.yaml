repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: complexity-check
        name: complexity-check
        language: system
        entry: python3 .cursor/hooks/complexity-guard.py --check
        pass_filenames: false
        always_run: true

