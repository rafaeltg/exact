[project]
name = "exact"
version = "0.2.0"
description = "Open Deep Research agent (Exa + Elicit, LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.4.0",
  "langchain>=1.0.0",
  "langchain-openai>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-core>=0.3.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "exa-py>=1.2.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.16.0",
]

[project.scripts]
exact = "exact.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", ".cursor/hooks"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "BLE",
  "SIM",
  "RUF",
]
ignore = [
  "SIM108",  # if/else is clearer than a ternary at tool dispatch
]

[tool.ruff.lint.isort]
known-first-party = ["exact"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
